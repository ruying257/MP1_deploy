defaults:
  - task: adroit_hammer

name: train_pisb_het_experiment

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

horizon: 4
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: mp1.policy.pisb_het_policy.PISBHetPolicy
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  # [新增] 你的创新点参数
  bridge_stiffness: 0.1
  bridge_damping: 0.1
  bridge_sigma: 0.1 
  # 取1时，bridge_stiffness、bridge_damping、bridge_sigma设置为0.1，取10时，设置为1.5、0.5、0.1
  num_inference_steps: 1


  # ==========================================
  # [新增: 创新点2 - 异方差机制参数]
  # 提取到此处方便 Ablation Study
  # ==========================================
  # 控制不确定性的预测范围 (防止 NLL Loss 爆炸或坍缩)
  log_var_min: -10.0   # 允许的最小对数方差 (值越小，允许网络越"自信")
  log_var_max: -2.0     # 允许的最大对数方差 (值越大，允许网络越"摆烂")
  
  # 初始不确定性偏置
  # 设为负数 (如 -5.0) 意味着训练初期网络认为方差较小，倾向于拟合均值
  # 设为 0.0 意味着训练初期网络认为环境非常随机，倾向于平滑Loss
  het_init_bias: -5.0  
  
  # NLL Loss 在总 Loss 中的权重系数
  nll_weight: 1.0      
  # ==========================================
  
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  crop_shape:
  - 84
  - 84
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  use_pc_color: false
  pointnet_type: "mlp"


  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false


ema:
  _target_: mp1.model.mean.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3000
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 200
  checkpoint_every: 200
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  max_grad_norm: 1.0
  ema_decay: 0.95

# Conditional_ConsistencyFM:
#   eps : 1e-2
#   num_segments : 2
#   boundary : 1
#   delta  : 1e-2
#   alpha :  1e-5
#   num_inference_step : 1

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${exp_name}_${training.seed}
  project: pisb_het
  resume: true
  tags:
  - pisb

checkpoint:
  save_ckpt: False # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}