
# Generic base config for PISB + action-history Mamba.
# Use it with your existing task configs:
#   python train_mp1_action_history.py --config-name pisb-action-history-mamba-pro task=<your_task_config>
#
# Examples:
#   task=adroit_hammer
#   task=<your_metaworld_task>

defaults:
  - task: adroit_hammer

name: train_pisb_action_history_mamba_pro

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "pisb_action_history_mamba_pro"

horizon: 4
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: mp1.policy.pisb_action_history_mamba_pro_policy.PISBActionHistoryMambaProPolicy

  # ----- PISB core -----
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  bridge_stiffness: 1.5
  bridge_damping: 0.5
  bridge_sigma: 0.1
  num_inference_steps: 10

  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  crop_shape: [84, 84]
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: true
  shape_meta: ${shape_meta}
  use_pc_color: false
  pointnet_type: "mlp"

  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm
    normal_channel: false

  # ----- Action history dataset wrapper -----
  use_action_history: true
  action_history_len: 8
  action_history_pad_mode: zero
  return_action_history_delta: true

  # ----- Mamba history encoder -----
  history_model_dim: 128
  history_depth: 2
  history_d_state: 16
  history_d_conv: 4
  history_expand: 2
  history_dropout: 0.10
  history_fusion_dim: 256

  # ----- Stable fusion tricks -----
  history_dropout_prob: 0.10
  history_cond_scale: 0.05
  history_gate_scale: 0.05
  history_reg_weight: 1.0e-4
  adapter_hidden_dim: 256

ema:
  _target_: mp1.model.mean.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3000
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 200
  checkpoint_every: 200
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  max_grad_norm: 1.0
  ema_decay: 0.95

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${exp_name}_${training.seed}
  project: pisb_action_history_mamba
  resume: true
  tags: [pisb, action-history, mamba]

checkpoint:
  save_ckpt: False
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
